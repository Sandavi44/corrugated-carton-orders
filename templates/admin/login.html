{% extends "admin/login.html" %}
{% load i18n %}

{% block content %}
{{ block.super }}

{% if DEMO_MODE %}
<div style="margin: 1.5rem 0; text-align: center;">
  <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem;">
    <div style="flex:1; height:1px; background: var(--border-color, #ddd);"></div>
    <span style="font-size: 0.75rem; color: var(--secondary, #888); text-transform: uppercase; letter-spacing: 0.05em;">or</span>
    <div style="flex:1; height:1px; background: var(--border-color, #ddd);"></div>
  </div>
  <a href="{% url 'demo_login' %}"
     style="display: inline-block; width: 100%; box-sizing: border-box;
            padding: 0.75rem 1rem; border-radius: 4px; font-size: 0.95rem;
            font-weight: 600; text-decoration: none; text-align: center;
            border: 2px solid var(--primary, #b1804e);
            color: var(--primary, #b1804e);
            background: transparent;
            transition: background 0.15s, color 0.15s;"
     onmouseover="this.style.background='var(--primary, #b1804e)'; this.style.color='#fff';"
     onmouseout="this.style.background='transparent'; this.style.color='var(--primary, #b1804e)';">
    ⚡ Try Demo — No Login Required
  </a>
  <p style="margin-top: 0.5rem; font-size: 0.75rem; color: var(--secondary, #888);">
    Staging instance &middot; fake data only &middot; safe to explore
  </p>
</div>
{% endif %}
{% endblock %}
