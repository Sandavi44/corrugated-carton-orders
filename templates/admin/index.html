{% extends "admin/index.html" %}
{% load static %}

{% block sidebar %}
<!-- Hide the sidebar to reclaim full page width -->
{% endblock %}

{% block content %}
<style>
  /* Override the default 600px limit on Django dashboard content width */
  .dashboard #content {
    width: auto !important;
    max-width: 100% !important;
    box-sizing: border-box !important;
  }

  /* Override default admin float layouts to use full width */
  #content-main {
    width: 100% !important;
    float: none !important;
    margin-right: 0 !important;
  }

  /* Premium Dashboard Grid spanning full width in a single row on desktop */
  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1.5rem;
    width: 100% !important;
    max-width: 1200px;
    margin: 1.5rem auto 2rem;
  }

  @media (max-width: 1024px) {
    .dashboard-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  @media (max-width: 640px) {
    .dashboard-grid {
      grid-template-columns: 1fr;
    }
  }

  .dashboard-card {
    text-decoration: none !important;
    color: var(--body-fg) !important;
    background: #fffdf9;
    border: 1px solid var(--hairline-color);
    border-radius: 8px;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 130px;
    box-sizing: border-box;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    box-shadow: 0 1px 3px rgba(43, 36, 32, 0.05);
  }

  .dashboard-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(122, 83, 48, 0.14);
    border-color: var(--accent);
  }

  .card-icon-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    border-radius: 8px;
    background: #fcf6e8;
    border: 1px solid #ebdcb9;
    font-size: 1.6rem;
    margin-bottom: 0.75rem;
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  .dashboard-card:hover .card-icon-wrapper {
    background: #f7efdd;
    border-color: var(--accent);
  }

  .card-title {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--secondary);
    margin: 0;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 0.5rem;
    color: var(--link-fg);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    text-decoration: none !important;
    font-weight: 600;
    transition: color 0.2s ease;
  }
  .back-link:hover {
    color: var(--secondary);
  }
</style>

<div id="content-main">
  <a href="/" class="back-link">&larr; Back to the order search app</a>

  <div class="dashboard-grid">
    <a href="/admin/orders/order/" class="dashboard-card">
      <div class="card-icon-wrapper">📦</div>
      <h3 class="card-title">Orders</h3>
    </a>

    <a href="/admin/orders/boxtype/" class="dashboard-card">
      <div class="card-icon-wrapper">🏷️</div>
      <h3 class="card-title">Box Types</h3>
    </a>

    <a href="/admin/orders/plytype/" class="dashboard-card">
      <div class="card-icon-wrapper">📐</div>
      <h3 class="card-title">Ply Types</h3>
    </a>

    <a href="/admin/orders/customer/" class="dashboard-card">
      <div class="card-icon-wrapper">🏢</div>
      <h3 class="card-title">Customers</h3>
    </a>

    <a href="/admin/auth/user/" class="dashboard-card">
      <div class="card-icon-wrapper">👤</div>
      <h3 class="card-title">Staff Logins</h3>
    </a>
  </div>
</div>
{% endblock %}
