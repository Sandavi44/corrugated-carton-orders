databases:
  - name: chelsy-packaging-db
    plan: free

services:
  - type: web
    name: chelsy-packaging-orders
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn carton_factory.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: chelsy-packaging-db
          property: connectionString
      # Add CLOUDINARY_URL manually in the Render dashboard once you have
      # a Cloudinary account (see README) — not something to hardcode here.
